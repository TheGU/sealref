[package]
name = "sealref"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A tiny runtime secret-reference resolver for software that cannot natively use a secret manager"
license = "MIT"
repository = "https://github.com/TheGU/sealref"
homepage = "https://github.com/TheGU/sealref"
readme = "README.md"
keywords = ["secrets", "vault", "conjur", "cyberark", "dotenv"]
categories = ["command-line-utilities"]

[dependencies]
argon2 = "0.6"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
regex-lite = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Default features would also pull gzip, which nothing here uses. The version is pinned to the one
# ureq itself depends on so the Mozilla root bundle is compiled in once rather than twice.
ureq = { version = "2", default-features = false, features = ["tls"] }
webpki-roots = "0.26"
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Argon2id is a memory-hard function by design. Unoptimised it is slow enough to dominate the test
# suite, so dependencies are optimised even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
