[package]
name = "sealref"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A tiny runtime secret-reference resolver for software that cannot natively use a secret manager"
license = "MIT"
repository = "https://github.com/sealref/sealref"
readme = "README.md"
keywords = ["secrets", "vault", "dotenv", "encryption", "containers"]
categories = ["command-line-utilities"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "2"
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Argon2id is a memory-hard function by design. Unoptimised it is slow enough to dominate the test
# suite, so dependencies are optimised even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
