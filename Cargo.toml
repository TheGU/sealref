[package]
name = "sealref"
version = "0.2.4"
edition = "2021"
rust-version = "1.98"
description = "A tiny runtime secret-reference resolver for software that cannot natively use a secret manager"
license = "MIT"
repository = "https://github.com/TheGU/sealref"
homepage = "https://github.com/TheGU/sealref"
readme = "README.md"
keywords = ["secrets", "vault", "conjur", "cyberark", "dotenv"]
categories = ["command-line-utilities"]

[dependencies]
argon2 = "0.6"
base64 = { version = "0.23", default-features = false, features = ["std"] }
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
regex-lite = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# `rustls` is the ring provider and the compiled-in Mozilla root bundle. Default features would also
# pull gzip, which nothing here uses.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

# Argon2id is a memory-hard function by design. Unoptimised it is slow enough to dominate the test
# suite, so dependencies are optimised even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
