name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install the toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - name: Build with the declared minimum
        run: cargo +${{ steps.msrv.outputs.version }} build --locked --all-targets

  image:
    name: static image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the scratch image
        run: docker build -t sealref:ci .
      - name: Prove the binary runs with nothing else in the image
        run: docker run --rm sealref:ci --version
