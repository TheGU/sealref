name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  image:
    name: static image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the scratch image
        run: docker build -t sealref:ci .
      - name: Prove the binary runs with nothing else in the image
        run: docker run --rm sealref:ci --version
