name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the tag and Cargo.toml agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v0.1.1 shipped a binary that reports 0.2.0, because the tag was cut from a main that had
      # already taken the version bump. A release whose tag and contents disagree is worse than no
      # release: whoever pins it gets behaviour the tag does not name, and nothing says so.
      - name: Compare the tag with the crate version
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME carries crate version $crate" >&2
            echo "retag, or bump Cargo.toml before tagging" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: sealref
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: sealref.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: sealref
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Install the musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="sealref-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  image:
    name: the scratch image on GHCR
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # The tarballs cannot serve this purpose. An image is what `COPY --from` needs, and it is
      # what keeps a consumer from having to carry a shell, curl and tar in a stage that has none
      # of them just to fetch and verify an archive.
      #
      # The tag is the plain version, without the leading v, because that is how a FROM line pins.
      # linux/amd64 only: the Dockerfile builds x86_64-unknown-linux-musl and nothing else.
      - name: Build and push
        run: |
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repo:${GITHUB_REF_NAME#v}"
          docker build -t "$image" .
          docker run --rm "$image" --version
          docker push "$image"

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." \
            dist/*
